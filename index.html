<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.55 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #1c1530; background: #fbf9ff; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  header { padding: 28px 0; display: flex; align-items: center; gap: 10px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, #8b4dff, #c26bff); }
  .name { font-weight: 700; font-size: 19px; }
  .hero { padding: 48px 0 40px; }
  .hero h1 { margin: 0 0 10px; font-size: 40px; line-height: 1.15; letter-spacing: -.5px; }
  .hero h1 span { color: #7a3cff; }
  .hero p { margin: 0; max-width: 480px; color: #5d5570; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: #8a82a0; margin: 24px 0 12px; }
  .app { display: flex; gap: 18px; align-items: center; padding: 18px; border-radius: 18px; background: #fff;

  .app h3 { margin: 0; font-size: 19px; }
  .app h3 a { color: inherit; text-decoration: none; }
  .app .sub { margin: 0 0 8px; font-size: 14px; color: #8a82a0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 14px; }
  .btn { padding: 6px 14px; border-radius: 999px; background: #7a3cff; color: #fff; text-decoration: none; font-weight: 600; }
  .soon { padding: 6px 14px; border-radius: 999px; background: #efe9fb; color: #7a6f92; }
  .links { align-self: center; white-space: nowrap; color: #b3abc6; }
  .links a { color: #7a3cff; }
  footer { margin: 64px 0 32px; padding-top: 20px; border-top: 1px solid #ece6f7; font-size: 14px; color: #8a82a0;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  footer a { color: #7a3cff; }
  @media (max-width: 480px) {
    .hero { padding: 24px 0 32px; }
    .hero h1 { font-size: 32px; }
    .app { align-items: flex-start; }
    .app img { width: 60px; height: 60px; border-radius: 14px; }
  }
</style>
